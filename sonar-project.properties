# Set sonar.organization and sonar.projectKey for the club-owned SonarCloud project in CI.
sonar.projectName=HAWConnect

sonar.sources=src
sonar.tests=src/utils/tests
sonar.test.inclusions=**/*.test.ts

sonar.exclusions=**/__generated__/**,src/assets/**,src/data/licenses.json,src/data/package-licenses.json,src/uniwind-types.d.ts

# Thin university HTTP clients are rename-only in many PRs and cannot be unit-tested
# alongside sticky Bun mock.module without poisoning session suites.
sonar.coverage.exclusions=**/__generated__/**,src/assets/**,src/app/**,src/components/**,src/hooks/**,src/data/licenses.json,src/utils/tests/**,src/api/university-api.ts,src/api/university-authenticated-api.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
