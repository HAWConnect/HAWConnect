overwrite: true
schema: '../hawconnect-backend/src/schema/*.gql'
documents: 'src/api/**/*.ts'
generates:
    'src/__generated__/gql/':
        preset: 'client'
        presetConfig:
            fragmentMasking:
                unmaskFunctionName: 'getFragmentData'
        config:
            documentMode: 'string'
    'src/__generated__/schema.graphql':
        plugins: ['schema-ast']
        config:
            includeDirectives: true
config:
    scalars:
        DateTime: 'Date'
        URL: 'string'
        LocalTime: 'string'
        EmailAddress: 'string'
